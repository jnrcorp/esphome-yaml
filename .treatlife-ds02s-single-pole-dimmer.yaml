substitutions:
  device_name: kitchen-table
  friendly_name: Kitchen Table
  min_brightness: "70"
  max_brightness: "1000"
  min_brightness_pct: "7"
  max_brightness_pct: "100"

esphome:
  name: $device_name
  friendly_name: $friendly_name
  comment: "TreatLife DS02S Single Pole Dimmer BK7231T v1.1.71"
  on_boot:
    priority: -100
    then:
      - delay: 5s
      - number.set:
          id: light_brightness
          value: $max_brightness_pct

bk72xx:
  board: generic-bk7231t-qfn32-tuya

<<: !include .common.yaml

uart:
  rx_pin: RX1
  tx_pin: TX1
  baud_rate: 115200

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset Reason
  - platform: libretiny
    version:
      name: LibreTiny Version

  # Expose ESPHome version as sensor.
  - platform: version
    name: ESPHome Version
    
  - platform: wifi_info
    ip_address:
      name: IP Address
    ssid:
      name: SSID
    bssid:
      name: BSSID

light:
  - platform: tuya
    name: Dimmer
    switch_datapoint: 1
    dimmer_datapoint: 2
    min_value_datapoint: 3
    min_value: $min_brightness
    max_value: $max_brightness

switch:
  - platform: tuya
    switch_datapoint: 1
    name: Switch
    entity_category: config

number:
  - platform: tuya
    number_datapoint: 2
    name: Brightness
    id: light_brightness
    unit_of_measurement: "%"
    min_value: $min_brightness_pct
    max_value: $max_brightness_pct
    step: 1
    multiply: 10
    mode: BOX
  - platform: tuya
    number_datapoint: 3
    name: Brightness Minimum
    unit_of_measurement: "%"
    min_value: 1
    max_value: 100
    step: 1
    multiply: 10
    mode: BOX
    entity_category: config
  - platform: tuya
    number_datapoint: 102
    name: Off Countdown
    unit_of_measurement: mins
    min_value: 0
    max_value: 1440
    step: 1
    entity_category: config
  - platform: tuya
    number_datapoint: 104
    name: Indicator
    min_value: 0
    max_value: 1
    step: 1
    entity_category: config

select:
  - platform: tuya
    enum_datapoint: 4
    entity_category: config
    name: Dimming Mode
    optimistic: true
    options:
      0: Led
      1: Incandescent
      2: Halogen
